name: Build AntiSleep

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AntiSleep APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-provider: basic

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Build APK
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antisleep-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
